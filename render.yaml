services:
  - type: web
    name: mouqarr-backend
    env: python
    plan: free
    region: frankfurt
    buildCommand: "pip install poetry && poetry install"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
